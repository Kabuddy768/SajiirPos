{% extends "base_dashboard.html" %}
{% block title %}{{ title }} — Sajiir POS{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block breadcrumb %}Dashboard / Suppliers / {{ title }}{% endblock %}

{% block content %}
<div style="max-width:600px;">
  <form method="post">
    {% csrf_token %}
    <div class="card">
      <div class="card-title">Supplier Details</div>
      
      <div class="form-group">
        <label for="id_name">Supplier Name *</label>
        <input type="text" id="id_name" name="name" value="{{ supplier.name|default:'' }}" required placeholder="e.g. Unilever Kenya Ltd">
      </div>

      <div class="form-group">
        <label for="id_contact_person">Contact Person</label>
        <input type="text" id="id_contact_person" name="contact_person" value="{{ supplier.contact_person|default:'' }}" placeholder="e.g. Jane Doe">
      </div>

      <div class="form-group">
        <label for="id_email">Email Address</label>
        <input type="email" id="id_email" name="email" value="{{ supplier.email|default:'' }}" placeholder="e.g. sales@supplier.com">
      </div>

      <div class="form-group">
        <label for="id_phone">Phone Number</label>
        <input type="text" id="id_phone" name="phone" value="{{ supplier.phone|default:'' }}" placeholder="e.g. +254 712 345678">
      </div>

      <div class="form-group">
        <label for="id_kra_pin">KRA PIN (VAT Registration)</label>
        <input type="text" id="id_kra_pin" name="kra_pin" value="{{ supplier.kra_pin|default:'' }}" placeholder="e.g. P051234567A">
      </div>

      <div class="form-group">
        <label for="id_address">Physical Address</label>
        <textarea id="id_address" name="address" rows="3" placeholder="e.g. Industrial Area, Road A, Nairobi">{{ supplier.address|default:'' }}</textarea>
      </div>

      <div style="display:flex; gap:12px; margin-top:32px; justify-content: flex-end;">
        <a href="{% url 'supplier_list' %}" class="btn-secondary">Cancel</a>
        <button type="submit" class="btn-primary" style="padding:10px 40px;">Save Supplier</button>
      </div>
    </div>
  </form>
</div>
{% endblock %}
