<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block page_title %}Sajiir POS{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #050714; --surface: #0d1117; --card: #111827;
      --border: rgba(255,255,255,0.07);
      --primary: #6366f1; --primary-glow: rgba(99,102,241,0.2);
      --accent: #10b981; --text: #f1f5f9; --muted: #94a3b8;
      --error: #ef4444; --error-bg: rgba(239,68,68,0.1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif; background: var(--bg);
      color: var(--text); min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 24px;
    }
    .auth-wrap { width: 100%; max-width: 440px; }
    .auth-logo { text-align: center; margin-bottom: 40px; }
    .auth-logo a { text-decoration: none; display: inline-flex; align-items: center; gap: 10px; }
    .logo-icon {
      width: 42px; height: 42px; background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 12px; display: flex; align-items: center; justify-content: center;
    }
    .logo-icon span { color:#fff; font-weight:800; font-size:18px; }
    .logo-text { font-size: 20px; font-weight: 700; color: var(--text); }
    .auth-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 20px; padding: 40px;
    }
    .auth-card h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .auth-card p.subtitle { color: var(--muted); font-size: 14px; margin-bottom: 32px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
    .form-group input, .form-group select {
      width: 100%; padding: 11px 14px;
      background: rgba(255,255,255,0.04); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text); font-size: 14px; font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
      appearance: none;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .field-error { color: var(--error); font-size: 12px; margin-top: 6px; }
    .form-error {
      background: var(--error-bg); border: 1px solid rgba(239,68,68,0.3);
      border-radius: 10px; padding: 12px 16px; margin-bottom: 20px;
      font-size: 13px; color: #fca5a5;
    }
    .btn-submit {
      width: 100%; padding: 12px; background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff; font-size: 15px; font-weight: 600; border: none;
      border-radius: 10px; cursor: pointer; font-family: inherit;
      box-shadow: 0 4px 20px var(--primary-glow); transition: all 0.2s;
    }
    .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 6px 28px var(--primary-glow); }
    .auth-footer { text-align: center; margin-top: 24px; font-size: 13px; color: var(--muted); }
    .auth-footer a { color: #a5b4fc; text-decoration: none; font-weight: 500; }
    .progress-steps {
      display: flex; align-items: center; gap: 0; margin-bottom: 36px;
    }
    .step {
      flex: 1; text-align: center; position: relative;
      font-size: 12px; font-weight: 600;
    }
    .step-dot {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; margin: 0 auto 6px;
      border: 2px solid var(--border); color: var(--muted);
    }
    .step.active .step-dot { background: var(--primary); border-color: var(--primary); color: #fff; }
    .step.done .step-dot { background: var(--accent); border-color: var(--accent); color: #fff; }
    .step-line { position: absolute; top: 14px; left: 50%; right: -50%; height: 2px; background: var(--border); z-index: -1; }
    .step.done .step-line { background: var(--accent); }
    .plan-option {
      border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px;
      margin-bottom: 12px; cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; gap: 14px;
    }
    .plan-option:hover { border-color: rgba(99,102,241,0.4); }
    .plan-option input[type=radio] { display: none; }
    .plan-option.selected { border-color: var(--primary); background: var(--primary-glow); }
    .plan-name { font-weight: 700; font-size: 14px; }
    .plan-price-sm { color: var(--primary); font-size: 13px; font-weight: 600; }
    .plan-desc-sm { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .radio-dot {
      width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border);
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    }
    .plan-option.selected .radio-dot { border-color: var(--primary); }
    .plan-option.selected .radio-dot::after { content:''; width:8px; height:8px; border-radius:50%; background:var(--primary); }
    .subdomain-wrap { display: flex; align-items: center; gap: 0; }
    .subdomain-prefix {
      padding: 11px 12px; background: rgba(255,255,255,0.02);
      border: 1px solid var(--border); border-right: none;
      border-radius: 10px 0 0 10px; font-size: 13px; color: var(--muted);
      white-space: nowrap;
    }
    .subdomain-wrap input {
      border-radius: 0 10px 10px 0 !important;
    }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-logo">
      <a href="/">
        <div class="logo-icon"><span>S</span></div>
        <span class="logo-text">Sajiir POS</span>
      </a>
    </div>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
